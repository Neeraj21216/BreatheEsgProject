services:
  - type: web
    name: breatheesg
    runtime: docker
    plan: starter
    branch: main
    dockerfilePath: Dockerfile
    autoDeployTrigger: commit
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: settings
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com localhost 127.0.0.1"
      - key: SECRET_KEY
        generateValue: true
